# Release: publish each charm to Charmhub's latest/edge channel.
#
# Runs on every push to main (continuous publishing of the edge channel) and on
# manual dispatch. The publish job is skipped unless a CHARMHUB_TOKEN secret is
# configured, so forks — and the upstream repo before a token is set — stay
# green instead of failing.
name: Release to edge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Expose whether a Charmhub token is available so the release job can skip
  # cleanly when it is not (secrets cannot be referenced in a job-level `if`).
  check-token:
    runs-on: ubuntu-24.04
    outputs:
      has-token: ${{ steps.check.outputs.has-token }}
    steps:
      - id: check
        run: echo "has-token=${{ secrets.CHARMHUB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  release:
    name: Release ${{ matrix.charm.name }}
    runs-on: ubuntu-24.04
    needs: check-token
    if: needs.check-token.outputs.has-token == 'true'
    strategy:
      fail-fast: false
      matrix:
        charm:
          - name: clickhouse-k8s
            path: charms/clickhouse-k8s
          - name: sentry-snuba-k8s
            path: charms/sentry-snuba-k8s
          - name: sentry-relay-k8s
            path: charms/sentry-relay-k8s
          - name: sentry-k8s
            path: charms/sentry-k8s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload ${{ matrix.charm.name }} to Charmhub
        uses: canonical/charming-actions/upload-charm@2.7.0
        with:
          credentials: ${{ secrets.CHARMHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          charm-path: ${{ matrix.charm.path }}
          channel: latest/edge
