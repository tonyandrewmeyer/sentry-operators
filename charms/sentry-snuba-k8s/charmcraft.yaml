# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/
type: charm
name: sentry-snuba-k8s
title: Snuba for Sentry
summary: Snuba, the search and analytics service of self-hosted Sentry.
description: |
  Snuba is the service that powers search, graphs, issue grouping and alerting
  in self-hosted Sentry by reading and writing event data in ClickHouse.

  This charm runs Snuba's HTTP query API together with the fleet of Kafka
  consumers and subscription executors that stream errors, outcomes,
  transactions, metrics and profiles into ClickHouse. It bootstraps the Kafka
  topics and ClickHouse schema, integrates with ClickHouse, Kafka and Redis, and
  hands the Sentry charm the API URL.

  It exists so the analytics tier of Sentry runs as its own scalable, observable
  Juju application. It is useful to anyone running self-hosted Sentry on
  Kubernetes with Juju.

base: ubuntu@24.04
platforms:
  amd64:

links:
  documentation: https://github.com/tonyandrewmeyer/sentry-operators/blob/main/docs/index.md
  source: https://github.com/tonyandrewmeyer/sentry-operators
  issues: https://github.com/tonyandrewmeyer/sentry-operators/issues
  website: https://github.com/getsentry/snuba
  contact: tony.meyer@gmail.com

assumes:
  - juju >= 3.6
  - k8s-api

containers:
  snuba:
    resource: snuba-image

resources:
  snuba-image:
    type: oci-image
    description: OCI image for Snuba, pinned to self-hosted Sentry 26.5.2.
    upstream-source: ghcr.io/getsentry/snuba:26.5.2

config:
  options:
    feature-complete:
      description: |
        Run the full set of Snuba consumers (transactions, metrics,
        generic-metrics, profiling, replays, issue platform and the
        events-analytics-platform) in addition to the always-on errors set.
        Disable for an errors-only deployment with a smaller footprint.
      default: true
      type: boolean
    event-retention-days:
      description: |
        How long event data is retained, in days. Must match the Sentry
        application's retention so ClickHouse TTLs line up.
      default: 90
      type: int

provides:
  snuba:
    interface: sentry_snuba
    optional: false
  metrics-endpoint:
    interface: prometheus_scrape
    optional: true
  grafana-dashboard:
    interface: grafana_dashboard
    optional: true

requires:
  clickhouse:
    interface: sentry_clickhouse
    limit: 1
    optional: false
  kafka:
    interface: kafka_client
    limit: 1
    optional: false
  redis:
    interface: redis
    limit: 1
    optional: false
  logging:
    interface: loki_push_api
    optional: true

peers:
  snuba-peers:
    interface: snuba_peers

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
