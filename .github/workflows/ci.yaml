# Continuous integration for the sentry-operators charm monorepo.
# Runs lint + unit tests, packs each charm, and checks the Terraform modules.
name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unit:
    name: Lint & unit (${{ matrix.charm }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        charm:
          - charms/clickhouse-k8s
          - charms/sentry-snuba-k8s
          - charms/sentry-relay-k8s
          - charms/sentry-k8s
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install tox
        run: uv tool install tox --with tox-uv

      - name: Lint
        run: tox -e lint
        working-directory: ${{ matrix.charm }}

      - name: Unit tests
        run: tox -e unit
        working-directory: ${{ matrix.charm }}

  library:
    name: Lint & unit (${{ matrix.library }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        library:
          - libs/sentry-dsn
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Lint
        run: |
          uvx ruff check src tests
          uvx ruff format --check src tests
        working-directory: ${{ matrix.library }}

      - name: Unit tests
        run: uv run --group unit pytest tests/unit -q
        working-directory: ${{ matrix.library }}

  pack:
    name: Pack (${{ matrix.charm }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        charm:
          - charms/clickhouse-k8s
          - charms/sentry-snuba-k8s
          - charms/sentry-relay-k8s
          - charms/sentry-k8s
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The canonical craft-actions pack action installs charmcraft + LXD and
      # runs `charmcraft pack` in the given working directory.
      - name: Pack charm
        id: pack
        uses: canonical/craft-actions/charmcraft/pack@acd2f2e61c7563b38ba89390ca0e910fa7d2784f # v0.1.1
        with:
          path: ${{ matrix.charm }}

      - name: Upload packed charm
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charm-${{ hashFiles(format('{0}/charmcraft.yaml', matrix.charm)) }}-${{ strategy.job-index }}
          path: ${{ matrix.charm }}/*.charm
          if-no-files-found: error

  terraform-check:
    name: Terraform check (${{ matrix.charm }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        charm:
          - charms/clickhouse-k8s
          - charms/sentry-snuba-k8s
          - charms/sentry-relay-k8s
          - charms/sentry-k8s
          # The root product/solution module that composes the four charms.
          - "."
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.charm }}/terraform

      - name: Terraform init
        run: terraform init -backend=false
        working-directory: ${{ matrix.charm }}/terraform

      - name: Terraform validate
        run: terraform validate
        working-directory: ${{ matrix.charm }}/terraform
