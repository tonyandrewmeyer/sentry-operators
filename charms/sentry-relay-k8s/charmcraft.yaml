# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/
type: charm
name: sentry-relay-k8s
title: Relay for Sentry
summary: Relay, the event-intake proxy of self-hosted Sentry.
description: |
  Relay is the service that sits at the front of self-hosted Sentry and accepts
  incoming events from SDKs before they reach the rest of the system. It is the
  first thing an event hits, so it has to be fast, resilient and able to shed
  load without losing data.

  This charm runs Relay in managed mode: it authenticates against the Sentry
  web upstream, normalises and validates incoming payloads, applies rate limits
  and inbound filters, scrubs sensitive data, and forwards the processed events
  onto Kafka for the rest of the pipeline to consume. It keeps a small amount of
  state in Redis (project configs, rate-limit counters) so that intake stays
  responsive even when the upstream is busy.

  It exists so the event-intake tier of Sentry runs as its own scalable,
  observable Juju application that can be placed close to where events arrive
  and scaled independently of the storage and query tiers. Relay generates a
  keypair on first start and registers itself with the Sentry upstream; the
  charm stores that keypair in a Juju secret so it survives restarts.

  It is useful to anyone running self-hosted Sentry on Kubernetes with Juju.

base: ubuntu@24.04
platforms:
  amd64:

links:
  documentation: https://github.com/tonyandrewmeyer/sentry-operators/blob/main/docs/index.md
  source: https://github.com/tonyandrewmeyer/sentry-operators
  issues: https://github.com/tonyandrewmeyer/sentry-operators/issues
  website: https://github.com/getsentry/relay
  contact: tony.meyer@gmail.com

assumes:
  - juju >= 3.6
  - k8s-api

containers:
  relay:
    resource: relay-image

resources:
  relay-image:
    type: oci-image
    description: OCI image for Relay, pinned to self-hosted Sentry 26.5.2.
    upstream-source: ghcr.io/getsentry/relay:26.5.2

config:
  options:
    log-level:
      description: |
        Relay's log level. Acceptable values are "trace", "debug", "info",
        "warn" and "error".
      default: "info"
      type: string

provides:
  metrics-endpoint:
    interface: prometheus_scrape
    optional: true
  grafana-dashboard:
    interface: grafana_dashboard
    optional: true

requires:
  kafka:
    interface: kafka_client
    limit: 1
    optional: false
  redis:
    interface: redis
    limit: 1
    optional: false
  sentry:
    interface: sentry_relay
    limit: 1
    optional: false
  ingress:
    interface: ingress
    limit: 1
    optional: true
  logging:
    interface: loki_push_api
    optional: true
  charm-tracing:
    interface: tracing
    limit: 1
    optional: true

peers:
  relay-peers:
    interface: relay_peers

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
