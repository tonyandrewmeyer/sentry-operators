# Release: publish each charm to Charmhub's latest/edge channel.
#
# Runs on every push to main (continuous publishing of the edge channel) and on
# manual dispatch. Guarded so it only runs on the canonical upstream repo, not
# on forks (which will not hold a valid CHARMHUB_TOKEN).
name: Release to edge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    name: Release ${{ matrix.charm.name }}
    runs-on: ubuntu-24.04
    # Only publish from the upstream repository; forks lack CHARMHUB_TOKEN.
    if: github.repository == 'tonyandrewmeyer/sentry-operator'
    strategy:
      fail-fast: false
      matrix:
        charm:
          - name: clickhouse-k8s
            path: charms/clickhouse-k8s
          - name: sentry-snuba-k8s
            path: charms/sentry-snuba-k8s
          - name: sentry-relay-k8s
            path: charms/sentry-relay-k8s
          - name: sentry-k8s
            path: charms/sentry-k8s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload ${{ matrix.charm.name }} to Charmhub
        uses: canonical/charming-actions/upload-charm@2.7.0
        with:
          credentials: ${{ secrets.CHARMHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          charm-path: ${{ matrix.charm.path }}
          channel: latest/edge
