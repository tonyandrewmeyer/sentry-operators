[project]
name = "charmlibs-interfaces-sentry-dsn"
description = "The charmlibs.interfaces.sentry_dsn package: integrate any charm with self-hosted Sentry and receive a DSN."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Tony Meyer" },
]
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 4 - Beta",
]
dynamic = ["version"]
dependencies = [
    # Wide bounds so the library does not over-constrain consuming charms.
    "ops>=2.17,<4",
]

[dependency-groups]
unit = [
    "ops[testing]",
    "pytest",
]

[project.urls]
"Repository" = "https://github.com/tonyandrewmeyer/sentry-operators/tree/main/libs/sentry-dsn"
"Issues" = "https://github.com/tonyandrewmeyer/sentry-operators/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charmlibs"]

[tool.hatch.version]
path = "src/charmlibs/interfaces/sentry_dsn/_version.py"

[tool.ruff]
line-length = 99
extend-exclude = [
    "lib",
    "lib/charms",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "C4",
    "N",
    "D",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "S101", "S105", "S106", "S108", "PLR2004", "ARG", "SLF001", "N802", "N803", "N806"]
"tests/*" = ["D1", "S101", "PLR2004", "S105", "S106"]
